[package]
name = "sentry-oc"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "sentry"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
